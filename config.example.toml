# mostro-watchdog configuration
# Copy this file to config.toml and fill in your values.

[mostro]
# Your Mostro daemon's Nostr public key (hex or npub format)
# Find this in your mostrod configuration
pubkey = "npub1..."

[nostr]
# Bootstrap relays — used to discover Mostro's NIP-65 (kind 10002) relay list.
# After discovery, the watchdog connects only to the relays advertised by Mostro.
# If no NIP-65 event is found, these relays are used as fallback.
relays = [
    "wss://relay.mostro.network",
    "wss://relay.damus.io",
]

# How often to re-fetch the NIP-65 relay list, in seconds (default: 7200 = 2 hours)
# nip65_refresh_interval = 7200

[telegram]
# Bot token from @BotFather (https://t.me/BotFather)
# 1. Open Telegram and search for @BotFather
# 2. Send /newbot and follow the instructions
# 3. Copy the token here
bot_token = "123456789:ABCdefGHIjklMNOpqrsTUVwxyz"

# Chat ID where alerts will be sent
# This can be a group, channel, or personal chat ID
# To get a group/channel ID:
# 1. Add your bot to the group/channel
# 2. Send a message in the group
# 3. Visit: https://api.telegram.org/bot<YOUR_TOKEN>/getUpdates
# 4. Find the "chat":{"id": ...} value
chat_id = -1001234567890

# Alert configuration (optional)
# Enable/disable specific types of dispute alerts
[alerts]
# New disputes (default: true)
initiated = true

# Dispute taken by solver (default: true)
in_progress = true

# Dispute resolved with seller refund (default: true)
seller_refunded = true

# Dispute settled with payment to buyer (default: true)
settled = true

# Dispute released by seller (default: true)
released = true

# Both parties cancelled cooperatively during the dispute (default: true)
cooperatively_canceled = true

# Other/unknown status changes (default: true)
other = true

# A status turned off still goes on the dispute's timeline (an edit, with no
# edit notification); it only never sends a new message.

# Edit notifications: Telegram does not notify of an edited message, so after
# each live edit of a dispute's message the watchdog sends a short reply to
# it, naming the step, and deletes that reply moments later. The phones ring,
# the channel stays one message per dispute. (default: true)
edit_notifications = true

# Seconds the reply stays before it is deleted, at most 300. Telegram clears
# the notification from the phone when the message is deleted, so the reply
# stays long enough to be seen; 0 deletes it at once. (default: 60)
edit_notification_lifetime = 60

# Serbero alerts (only with the [serbero] section below)
# Show Serbero's steps (mediating, guidance sent, handed off) on the
# dispute's timeline, an edit followed by the edit notification (default: true)
serbero_progress = true

# Names shown on the timeline for solvers, by pubkey (hex). A solver without
# a name shows as a shortened pubkey.
# [alerts.solver_names]
# "000000e2fdb5000000000000000000000000000000000000000000000000a7f1" = "grunch"

# Health check and monitoring configuration (optional)
[health]
# Enable periodic heartbeat notifications (default: false)
# Set to true if you want hourly "system online" messages in your chat
heartbeat_enabled = false

# Send heartbeat every N seconds (default: 3600 = 1 hour)
heartbeat_interval = 3600

# Check Nostr relay connections periodically (default: true)
check_relays = true

# Relay connection timeout in seconds (default: 30)
relay_timeout = 30

# Alert if no events received for N seconds (default: 7200 = 2 hours)
# Set to 0 to disable event silence alerts
event_alert_threshold = 7200

# Enable HTTP health status endpoint (default: false)
# Useful for external monitoring systems (uptime checkers, k8s liveness probes)
enable_http_endpoint = false

# HTTP endpoint port (default: 8080)
# Health endpoint will be available at http://localhost:8080/health
http_port = 8080

# HTTP endpoint bind address (default: "127.0.0.1")
# Set to "0.0.0.0" when running in Docker to allow port mapping
# http_bind = "0.0.0.0"

# --- Mostro health monitoring (see MOSTRO_HEALTH.md) ---
# Alerts when the Mostro instance stops working, not only when it stops
# running. Telegram gets state changes only: an alert, reminders while a
# critical one lasts, and a "resolved" message. Never periodic "all good".

# Phase 0: alert when Mostro's info event (kind 38385) is older than this many
# seconds. Set it to 3 x the instance's publish_mostro_info_interval (900 for
# mostrod's default of 300). 0 turns it off. (default: 10800)
# info_silence_threshold = 10800

# Report when Mostro enters and leaves maintenance mode. (default: true)
# alert_on_maintenance = true

# Phase 1: read Mostro's health event (kind 38389). Turn it on once mostrod
# publishes it; until then Mostro would be reported as silent. (default: false)
# mostro_health_enabled = false

# Seconds between two checks; also the interval of the watchdog's own
# heartbeat. Between 30 and 3600. (default: 60)
# check_interval = 60

# Bad readings in a row before an alert, and good ones before it is resolved.
# (default: 3)
# consecutive_samples = 3

# Seconds between reminders of a critical alert that is still active. 0 never
# reminds; warnings never do. (default: 3600)
# renotify_interval = 3600

# Other Mostro instances (npub or hex) you trust: the median block height of
# those on the same network (at least 3 fresh) is a reference too, next to the
# explorers. Never every discovered instance: anyone can sign an event with a
# made-up height. (default: none, explorers only)
# trusted_peers = []

# Publish the watchdog's own heartbeat (kind 38389, z = watcher). It is also
# the relay round-trip probe that tells "relays down" from "Mostro silent".
# Needs the watchdog's key, and only happens once mostro_health_enabled or
# peer_watchdogs is set: an upgrade alone publishes nothing. (default: true)
# publish_heartbeat = true

# Name Mostro in a public `watching` tag of the heartbeat. It links the
# watchdog's key to the instance in public. (default: false)
# heartbeat_watching_tag = false


# Other watchdogs (npub or hex) whose heartbeat this one watches. Run two on
# different machines, each with the other's key here. (default: none)
# peer_watchdogs = []

# Telegram chat for health alerts. (default: [telegram].chat_id)
# alerts_chat_id = -1001234567890

# Environment variable with the watchdog's Nostr secret key: it decrypts the
# health event's details and signs the heartbeat. Optional here: without it
# only the public tags are read. Set the watchdog's hex pubkey (logged at
# startup) as the health recipient in mostrod.
# (default: "WATCHDOG_NOSTR_PRIVATE_KEY")
# private_key_env = "WATCHDOG_NOSTR_PRIVATE_KEY"

# Environment variable with a key that only decrypts the health details. Two
# watchdogs must sign their heartbeats with different private_key_env keys but
# may share this one. When the variable is unset, the private_key_env key
# decrypts. (default: "WATCHDOG_HEALTH_DECRYPT_KEY")
# decrypt_key_env = "WATCHDOG_HEALTH_DECRYPT_KEY"

# Explorers asked for the chain tip, per lnd_network. A table here replaces
# the defaults (mainnet, testnet, testnet4, signet), so list every network you
# need. Networks without explorers (regtest) skip the cross-check.
# [health.block_height_sources]
# mainnet = [
#     "https://mempool.space/api/blocks/tip/height",
#     "https://blockstream.info/api/blocks/tip/height",
# ]

# When a reading counts as bad. (defaults shown)
# [health.thresholds]
# block_lag_blocks = 3
# block_lag_for_secs = 900
# unsynced_for_secs = 600
# no_payout_success_secs = 7200
# payout_failure_rate = 0.5
# payout_failure_min_attempts = 3
# htlc_expiry_blocks = 72
# settled_unpaid_warn_secs = 1800
# inactive_channels_warn_secs = 1800
# degraded_for_secs = 600

# Serbero alerts (optional)
# Serbero is Mostro's dispute assistant. With this section, the watchdog shows
# Serbero's progress on each dispute and pings the chat when Serbero hands a
# dispute off and a human solver must take it over. Without it, nothing changes.
#
# Setup:
# 1. Generate a Nostr key for the watchdog, used for nothing else (for example
#    `openssl rand -hex 32` or `nak key generate`), and export it before
#    starting the watchdog:
#      export WATCHDOG_NOSTR_PRIVATE_KEY=...   # nsec or hex
# 2. Start the watchdog: it logs its public key in npub and hex.
# 3. Add the hex public key to Serbero's config and restart Serbero:
#      [[observers]]
#      pubkey = "<watchdog hex pubkey>"
#    Register it as an observer, not as a solver: observers only get the first
#    line of each mediation update, never what the parties wrote.
# [serbero]
# Environment variable holding the watchdog's own Nostr secret key (nsec or hex).
# Never put the key itself in this file. (default: "WATCHDOG_NOSTR_PRIVATE_KEY")
# private_key_env = "WATCHDOG_NOSTR_PRIVATE_KEY"

# Serbero's public key (npub or hex). When omitted, it is read from the Mostro
# node's info event (kind 38385, `serbero` tag) and checked again every 10
# minutes (or every nip65_refresh_interval, if shorter).
# pubkey = "npub1..."
#
# The watchdog hears Serbero only on its own relays (the bootstrap relays above,
# then the Mostro node's NIP-65 relays): Serbero must publish to at least one.

# Solver notifications (optional)
# A solver who links their Mostro solver key (send /link to the bot in a private
# chat, then enter the code in Mostrix) gets a private message when a party
# writes to them in a dispute they took. The watchdog never holds a private key
# of the solver or of a party and never reads the chat. See
# SOLVER_NOTIFICATIONS.md.
# [solver_notifications]
# Environment variable holding the watchdog's own Nostr secret key (nsec or hex).
# Use the same one as [serbero] so the watchdog has a single key.
# (default: "WATCHDOG_NOSTR_PRIVATE_KEY")
# private_key_env = "WATCHDOG_NOSTR_PRIVATE_KEY"

# Seconds to wait for the solver's own-message receipt before notifying; also
# groups a burst of messages into one notification. (default: 20, at most 600)
# grace_period = 20
