[package]
name = "mostro-watchdog"
version = "0.4.1"
edition = "2021"
authors = ["MostroP2P"]
description = "Nostr-based notification bot for Mostro administrators. Monitors dispute events and sends real-time Telegram alerts."
license = "MIT"
repository = "https://github.com/MostroP2P/mostro-watchdog"
keywords = ["nostr", "mostro", "telegram", "bot", "notifications"]
categories = ["command-line-utilities"]

[dependencies]
nostr-sdk = "0.45.2"
teloxide = { version = "0.17", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hyper = { version = "1.1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
http-body-util = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
# Opens Serbero's Mostro protocol v2 DMs (kind 14, NIP-44); no hand-rolled crypto
mostro-core = "0.16.0"
# Dispute ids in Mostro messages (already in the tree through mostro-core)
uuid = "1.26.1"
thiserror = "2.0.21"

[dev-dependencies]
futures = "0.3.34"
# In-process relays (MockRelay) for the Serbero subscription and discovery tests
nostr-sdk = { version = "0.45.2", features = ["local-relay"] }
tempfile = "3"
# Paused clock for the discovery grace tests
tokio = { version = "1", features = ["test-util"] }

[package.metadata.release]
# Automatically create and push git tag
tag = true
# Push to origin
push = true  
# Don't publish to crates.io (this is a binary, not a library)
publish = false
# Pre-release hook to ensure tests pass
pre-release-hook = ["cargo", "test"]
# Post-release hook could be used to trigger additional actions
# post-release-hook = ["echo", "Release completed for {{version}}"]

[profile.release]
strip = true
lto = true

[features]
default = []
# Use vendored OpenSSL for cross-compilation (ARM64 Linux)
openssl-vendored = ["dep:openssl"]

[dependencies.openssl]
version = "0.10"
features = ["vendored"]
optional = true
